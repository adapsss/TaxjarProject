# Whole demo in Docker:  docker compose up --build -d
#   http://taxjar.test:8080             the live app
#   http://simulator.taxjar.test:8081   shortcut: redirects to the simulator on the app port
# Both names point at 127.0.0.1 in /etc/hosts (see docker/README.md).
name: taxjar

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxjar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxjar}
      POSTGRES_DB: ${POSTGRES_DB:-taxjar}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # local tools and the test suite only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxjar} -d ${POSTGRES_DB:-taxjar}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-off: brings the schema up to date and imports the JSON into empty tables, then exits.
  # Safe on every start: data already in the database is left alone (see backend/app/data_load.py).
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m app.data_load"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taxjar}:${POSTGRES_PASSWORD:-taxjar}@db:5432/${POSTGRES_DB:-taxjar}
      DEMO_MODE: ${DEMO_MODE:-true}
      TAX_DATA_REFRESH_SECONDS: ${TAX_DATA_REFRESH_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${APP_PORT:-8080}:80" # the live app
      - "${SIMULATOR_PORT:-8081}:81" # shortcut to the simulator
    environment:
      APP_PORT: ${APP_PORT:-8080} # the simulator shortcut on SIMULATOR_PORT redirects here
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data: # Postgres; `docker compose down -v` starts from the JSON import and the seed again
