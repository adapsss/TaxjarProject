# Every push and pull request: backend tests on Postgres with the Python the plan requires (3.10) and a current one,
# frontend type-check, lint, unit tests and build, then the golden path end to end in a real browser.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_USER: taxjar
          POSTGRES_PASSWORD: taxjar
          POSTGRES_DB: taxjar_test
        ports: ["5433:5432"] # the tests' default TEST_DATABASE_URL
        options: --health-cmd "pg_isready -U taxjar -d taxjar_test" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend (type-check, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm test
      - run: npm run build

  golden-path:
    name: Golden path in a browser
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_USER: taxjar
          POSTGRES_PASSWORD: taxjar
          POSTGRES_DB: taxjar
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U taxjar -d taxjar" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://taxjar:taxjar@localhost:5433/taxjar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
      - name: Start the backend and the app
        run: |
          (cd backend && alembic upgrade head && python -m app.data_load)
          (cd backend && python -m uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &)
          (cd frontend && npx vite --port 5173 --strictPort > ../frontend.log 2>&1 &)
          for url in http://localhost:8000/api/account http://localhost:5173/; do
            for i in $(seq 1 60); do curl -sf "$url" > /dev/null && break; sleep 1; done
          done
      - name: Run the golden path
        working-directory: frontend
        run: npm run golden
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-path
          path: |
            frontend/screenshots/
            backend.log
            frontend.log
