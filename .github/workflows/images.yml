# Build the backend and web images and push them to ECR (eu-west-1) for the Kubernetes deployment (Argo CD).
#
# Runs after the CI workflow succeeds on a push to main, for exactly the commit CI tested, or by hand on main.
# Both images get the same tag, dev-<run number>; Argo CD Image Updater picks up the newest dev-N.
# Nothing happens in GitHub after the push: deployment, migrations and rollback are in nisabu/TaxjarProject-infra.
#
# Image Updater orders tags by the image's `created` time (newest-build strategy): keep the real build time.
# Do not set SOURCE_DATE_EPOCH or reproducible-build timestamp rewriting here. Never re-push an existing dev-N.
#
# AWS access: GitHub OIDC into the role infra created (nisabu/TaxjarProject-infra); the role trusts only
# repo:adapsss/TaxjarProject:ref:refs/heads/main. Every environment-specific value is in the env block below.
name: images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-main
  cancel-in-progress: false # never abandon a push half way

# All environment-specific values. Repository variables win; the literals are temporary fallbacks.
# TODO: drop the fallbacks once a repo admin sets the repository variables AWS_ROLE_ARN and AWS_REGION
#       (Settings → Secrets and variables → Actions → Variables). Nobody on the team can open Settings yet.
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '331725468486' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::331725468486:role/goyslop-dev-github-ci' }}
  BACKEND_REPOSITORY: goyslop-backend
  WEB_REPOSITORY: goyslop-web
  TAG: dev-${{ github.run_number }}

jobs:
  push:
    # Only a green CI run for a push to main of this repository, or a manual run started on main.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC → the infra role; no AWS keys stored in the repo
    strategy:
      fail-fast: true
      max-parallel: 1 # backend first, then web
      matrix:
        image: [backend, web] # docker/<image>.Dockerfile, pushed in this order
    steps:
      - id: commit
        name: The commit CI tested (a manual run builds the tip of main)
        run: echo "sha=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}
      - id: target
        name: Which ECR repository this image goes to
        run: echo "repository=${{ matrix.image == 'backend' && env.BACKEND_REPOSITORY || env.WEB_REPOSITORY }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: . # both Dockerfiles expect the repo root
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.target.outputs.repository }}:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false # plain image manifests for ECR and Image Updater
