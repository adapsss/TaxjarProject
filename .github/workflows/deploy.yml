# Production deploy: only after CI went green on main (or a manual rollback to a commit of main).
#
# Triggers:
#   - workflow_run: the CI workflow finished on a push to main of this repository and succeeded.
#     The commit that CI tested (workflow_run.head_sha) is the one that is built and shipped.
#   - workflow_dispatch: a rollback. Only from main, only with the sha of a commit that is on main.
# There is no push trigger: a push alone never deploys.
#
# The jobs: gate (checks the trigger and the image tag), test, publish, deploy. test, publish and deploy
# run on the one EC2 server, which is registered as a self-hosted runner with the label `taxjar`.
# The server only needs Docker and the AWS CLI: tests run inside the images that are about to ship.
# Access to the registry comes from the server's IAM role, so the repository holds no AWS keys.
# Setup: docs/deploy.md. The `production` environment must allow deployments from main only.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION     e.g. eu-north-1
#   ECR_REGISTRY   e.g. 123456789012.dkr.ecr.eu-north-1.amazonaws.com
#   APP_PORT       optional, default 80
#
# Roll back by hand (Actions > Deploy > Run workflow, branch main) with the commit sha of an image in the registry.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: the full 40-character commit sha of a commit on main whose image is already in the registry."
        required: true

# One deploy at a time, and never cancel one half way. A run that will do nothing (red CI, a pull request
# from a fork, a branch other than main) gets a group of its own, so it cannot push a real deploy out of the queue.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push' || github.event.workflow_run.head_repository.full_name != github.repository || github.event.workflow_run.head_branch != 'main'))) && format('deploy-ignored-{0}', github.run_id) || 'deploy-production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REGISTRY: ${{ vars.ECR_REGISTRY }}
  BACKEND_IMAGE: ${{ vars.ECR_REGISTRY }}/taxjar-backend
  WEB_IMAGE: ${{ vars.ECR_REGISTRY }}/taxjar-web

jobs:
  gate:
    name: Check what may be deployed
    # Everything below depends on this job, so a run that does not pass here does nothing at all.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      mode: ${{ steps.validate.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history of main, for the ancestor check
          persist-credentials: false
      - name: Validate the image tag
        id: validate
        # Values reach the script as environment variables, never pasted into it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            workflow_run) tag="$CI_SHA"; mode=build ;;
            workflow_dispatch)
              [ "$REF" = refs/heads/main ] || { echo "Run this workflow from main only."; exit 1; }
              tag="$INPUT_TAG"; mode=rollback ;;
            *) echo "Unexpected event $EVENT_NAME"; exit 1 ;;
          esac
          # Exactly 40 lowercase hex characters: no newline, no shell code, nothing that could reach .env.
          # In a bash regex, $ matches only at the very end of the string, so a trailing newline fails too.
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || { echo "The image tag must be a full 40-character lowercase hex commit sha."; exit 1; }
          # fetch-depth: 0 above already fetched every branch, so origin/main is here without any credentials.
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || { echo "origin/main is missing from the checkout."; exit 1; }
          git cat-file -e "$tag^{commit}" 2>/dev/null || { echo "$tag is not a commit of this repository."; exit 1; }
          git merge-base --is-ancestor "$tag" refs/remotes/origin/main \
            || { echo "$tag is not on main; only commits of main can be deployed."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  test:
    name: Test on the server
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'build' }}
    runs-on: [self-hosted, taxjar]
    timeout-minutes: 30
    outputs:
      tag: ${{ needs.gate.outputs.tag }}
    env:
      IMAGE_TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }} # the commit CI tested, not whatever main is now
      - name: Check the configuration
        run: |
          test -n "$AWS_REGION" || { echo "Set the repository variable AWS_REGION"; exit 1; }
          test -n "$REGISTRY" || { echo "Set the repository variable ECR_REGISTRY"; exit 1; }
      - name: Build the backend image
        run: docker build -f docker/backend.Dockerfile -t "$BACKEND_IMAGE:$IMAGE_TAG" .
      - name: Backend tests, inside the image that ships, against a throwaway Postgres
        run: |
          net="taxjar-test-$GITHUB_RUN_ID"; db="taxjar-test-db-$GITHUB_RUN_ID"
          docker network create "$net" > /dev/null
          trap 'docker rm -f "$db" > /dev/null 2>&1; docker network rm "$net" > /dev/null 2>&1' EXIT
          docker run -d --rm --name "$db" --network "$net" \
            -e POSTGRES_USER=taxjar -e POSTGRES_PASSWORD=taxjar -e POSTGRES_DB=taxjar_test postgres:17-alpine > /dev/null
          # pg_isready can pass before the init restart; a real query cannot.
          for _ in $(seq 1 60); do docker exec "$db" psql -U taxjar -d taxjar_test -c 'select 1' > /dev/null 2>&1 && break; sleep 1; done
          docker run --rm --network "$net" \
            -e TEST_DATABASE_URL="postgresql+psycopg://taxjar:taxjar@$db:5432/taxjar_test" \
            "$BACKEND_IMAGE:$IMAGE_TAG" python -m pytest -q -p no:cacheprovider
      - name: Frontend lint and unit tests
        run: docker build -f docker/web.Dockerfile --target test .
      - name: Build the web image (type-check and production build)
        run: docker build -f docker/web.Dockerfile -t "$WEB_IMAGE:$IMAGE_TAG" .

  publish:
    name: Push to the registry
    needs: test # a failed, cancelled or skipped test means nothing is pushed
    runs-on: [self-hosted, taxjar]
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ needs.test.outputs.tag }}
    steps:
      - name: Log in to the registry
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Push both images, by commit and as latest
        run: |
          for image in "$BACKEND_IMAGE" "$WEB_IMAGE"; do
            docker tag "$image:$IMAGE_TAG" "$image:latest"
            docker push "$image:$IMAGE_TAG"
            docker push "$image:latest"
          done

  deploy:
    name: Run on the server
    needs: [gate, publish]
    # Two ways in: publish succeeded (CI was green on main), or a rollback validated by the gate, where
    # test and publish are skipped on purpose. A failed or cancelled publish, or a skipped one in a normal
    # run (test failed), does not get through.
    if: >-
      ${{
        !cancelled() &&
        needs.gate.result == 'success' &&
        (needs.publish.result == 'success' ||
         (needs.gate.outputs.mode == 'rollback' && needs.publish.result == 'skipped'))
      }}
    runs-on: [self-hosted, taxjar]
    timeout-minutes: 15
    environment: production
    env:
      APP_DIR: /opt/taxjar
      APP_PORT: ${{ vars.APP_PORT || '80' }}
      IMAGE_TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - name: Check the image tag once more, before anything is written
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "Refusing to deploy: the image tag is not a 40-character commit sha."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }} # the compose file must match the images
      - name: Log in to the registry
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Remember the running version, for the automatic rollback
        id: previous
        run: |
          mkdir -p "$APP_DIR"
          tag=$(sed -n 's/^IMAGE_TAG=//p' "$APP_DIR/.env" 2>/dev/null | head -n 1 || true)
          # Only a full commit sha may become the rollback target; anything else is ignored.
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || tag=""
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install the compose file and its settings
        run: |
          cp compose.prod.yaml "$APP_DIR/compose.prod.yaml"
          # The database password is made once on the server and kept: the data volume was created with it.
          pw="$APP_DIR/.db-password"
          [ -s "$pw" ] || (umask 077 && openssl rand -hex 24 > "$pw")
          (umask 077 && printf 'REGISTRY=%s\nIMAGE_TAG=%s\nAPP_PORT=%s\nPOSTGRES_PASSWORD=%s\n' \
            "$REGISTRY" "$IMAGE_TAG" "$APP_PORT" "$(cat "$pw")" > "$APP_DIR/.env")
      - name: Pull and start
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --wait --wait-timeout 120
      - name: Smoke test through the gateway
        run: |
          curl -fsS "http://127.0.0.1:$APP_PORT/api/account" > /dev/null
          curl -fsS "http://127.0.0.1:$APP_PORT/api/tax/countries" > /dev/null
          curl -fsS "http://127.0.0.1:$APP_PORT/" | grep -q 'id="root"'
      - name: Roll back if the new version did not come up
        if: ${{ failure() && steps.previous.outputs.tag && steps.previous.outputs.tag != env.IMAGE_TAG }}
        working-directory: ${{ env.APP_DIR }}
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          echo "The new version did not come up; going back to $PREVIOUS_TAG"
          docker compose -f compose.prod.yaml logs --tail 80 || true
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env
          docker compose -f compose.prod.yaml up -d --wait --wait-timeout 120
      - name: Remove images nothing uses any more
        if: ${{ success() }}
        run: |
          docker image prune -af --filter "until=72h"
          docker builder prune -f --filter "until=72h"
