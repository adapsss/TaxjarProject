# Production on one server: runs the images the deploy pipeline pushed to the registry.
# Nothing is built here. The pipeline writes .env next to this file and runs:
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d --wait
#
# REGISTRY, IMAGE_TAG and POSTGRES_PASSWORD are required, e.g.
#   REGISTRY=123456789012.dkr.ecr.eu-north-1.amazonaws.com
#   IMAGE_TAG=<git commit sha>
#   POSTGRES_PASSWORD=<made once on the server by the pipeline, kept in /opt/taxjar/.db-password>
name: taxjar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taxjar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: taxjar
    volumes:
      - db-data:/var/lib/postgresql/data # survives deploys and reboots
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxjar -d taxjar"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always
    logging: *logging

  # One-off on every deploy: brings the schema up to date and imports the tax data into empty
  # tables, then exits. Data already in the database is left alone (backend/app/data_load.py).
  migrate:
    image: ${REGISTRY:?set REGISTRY}/taxjar-backend:${IMAGE_TAG:?set IMAGE_TAG}
    command: ["sh", "-c", "alembic upgrade head && python -m app.data_load"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://taxjar:${POSTGRES_PASSWORD}@db:5432/taxjar
      DEMO_MODE: "true"
      TAX_DATA_REFRESH_SECONDS: "60"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  backend:
    image: ${REGISTRY}/taxjar-backend:${IMAGE_TAG}
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    logging: *logging

  web:
    image: ${REGISTRY}/taxjar-web:${IMAGE_TAG}
    ports:
      - "${APP_PORT:-80}:80" # the app
      - "${SIMULATOR_PORT:-8081}:81" # shortcut to the simulator
    environment:
      APP_PORT: ${APP_PORT:-80} # the simulator shortcut redirects here
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/account"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    restart: always
    logging: *logging

volumes:
  db-data:
